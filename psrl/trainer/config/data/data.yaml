defaults:
  - legacy_data
  - _self_

# Use multi-dataset mode, fallback to veRL legacy mode if False.
use_multi_dataset: False

# Each entry specifies one dataset with its file path, prompt key,
# sample limit, and per-dataset reward model routing configuration.
#
# train_datas:
#   - file: /path/to/data.parquet
#     data_source_name: dataset/name
#     prompt_key: prompt
#     max_samples: -1           # -1 means use all samples
#     reward_model_dicts:
#       - reward_fn_key: data_source
#         reward_loop_type: naive   # "naive" | "dapo" | "gen"
#         reward_fn: default
#         reward_model_name: null
#         reward_coef: 1.0

reward_model_dicts:
  - reward_fn_key: data_source
    reward_loop_type: naive
    reward_fn: default
    reward_model_name: null
    reward_coef: 1.0

train_datas:
  - file: /jizhicfs/pkuhetu/yfzhao/psrl/data/gsm8k_verl/train.parquet
    data_source_name: openai/gsm8k
    prompt_key: prompt
    max_samples: -1
    reward_model_dicts:
      - reward_fn_key: data_source
        reward_loop_type: naive
        reward_fn: default
        reward_model_name: null
        reward_coef: 1.0
      # - reward_fn_key: data_source
      #   reward_loop_type: gen
      #   reward_fn: default
      #   reward_model_name: Qwen3-8B
      #   reward_coef: 1.0
  # - file: /jizhicfs/pkuhetu/yfzhao/psrl/data/dapo/dapo-math-17k.parquet
  #   data_source_name: dapo/dapo-math-17k
  #   prompt_key: prompt
  #   max_samples: -1
  #   reward_model_dicts:
  #     - reward_fn_key: data_source
  #       reward_loop_type: dapo
  #       reward_fn: default
  #       reward_model_name: null
  #       reward_coef: 1.0
  #     - reward_fn_key: data_source
  #       reward_loop_type: gen
  #       reward_fn: default
  #       reward_model_name: Qwen3-8B
  #       reward_coef: 1.0
  # - file: /jizhicfs/pkuhetu/yfzhao/psrl/data/full-hh-rlhf/data/train.parquet
  #   data_source_name: full-hh-rlhf
  #   prompt_key: prompt
  #   reward_loop_type: gen
  #   reward_fn: skywork
  #   reward_model_name: Skywork-Reward-V2-Qwen3-8B

# Sampling ratios for mixing multiple training datasets (must sum to ~1.0,
# and must have the same length as train_datas).
train_datasets_ratios: [1.0]

# Validation datasets. Each entry has the same structure as train_datas entries,
# but reward_model_dicts are used only for evaluation reward computation.
val_datas:
  - file: /jizhicfs/pkuhetu/yfzhao/psrl/data/gsm8k_verl/test.parquet
    prompt_key: prompt
    max_samples: -1
    reward_model_dicts:
      - reward_fn_key: data_source
        reward_loop_type: naive
        reward_fn: default
        reward_model_name: null
        reward_coef: 1.0
