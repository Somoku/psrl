schema_version = "1.4"

[task]
name = "sciaccel/laps-cpu"
description = "Accelerate LAPS on the container's CPUs."

[environment]
cpus = 4
memory_mb = 8192
docker_image = "sciaccel-laps-cpu-env"
build_timeout_sec = 60.0

[agent]
timeout_sec = 3600.0

[verifier]
timeout_sec = 900.0
environment_mode = "separate"

[verifier.environment]
cpus = 4
memory_mb = 8192
docker_image = "sciaccel-laps-cpu-verifier"
build_timeout_sec = 60.0
