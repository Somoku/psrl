# auto-scaling between rollout and reward model
elastic_rm:
  # Whether to enable auto-scaling between rollout and reward model
  enable: False

  # Number of nodes for shared resource pool
  shared_nnodes: 1

  # GPU number for each node in shared resource pool
  shared_ngpus_per_node: 8

  # Whether to enable policy-based scaling decisions in ElasticExecutor monitor loop
  enable_policy: True

  # Monitor interval for elastic policy loop
  monitor_interval_ms: 1000

  # Bound each monitor tick so a blocked coordinator or router cannot stall scaling.
  coordinator_sync_timeout_s: 10

  # Max seconds for each SLEEP/WAKE_UP/ABORT exec_command from ElasticExecutor to a coordinator.
  # Omit or 0 = wait indefinitely. When set, avoids pending stuck forever if a worker/router hangs.
  coordinator_command_timeout_s: 300

  # Abandon a stalled in-flight scaling decision after this many ticks. Zero waits forever.
  decision_execution_abandon_stall_ticks: 180

  # KV cache utilization threshold below which an instance can cede resources
  theta_low: 0.1

  # KV cache utilization threshold above which an instance is considered full-load
  theta_max: 0.8

  # Cooldown window after each scaling action to avoid oscillation
  cooldown_ms: 10000

  # Minimum bottleneck throughput gain required for one-step transfer
  hysteresis: 0.05

  # Minimum number of awake instances kept for each role.
  # Set to 0 to allow one side to fully sleep.
  min_awake_per_role: 1

  # Block scale-down when the selected instance exceeds this waiting queue limit.
  max_waiting_queue_for_scale_down: 64

  # Abort this fraction of each waiting queue after scale-up for FIFO load rebalancing.
  post_scale_up_abort_waiting_ratio: 0.8

  # Optional map {model_name: profile_json_path} for new throughput profile schema
  profile_paths: {}

  # Throughput-model directory containing {model_name}_token.json and fitted formula
  throughput_model_dir: psrl/config/throughput_model

  # Use token-throughput fit bucket by output length (default 1024)
  throughput_model_output_len: 1024

  # EWMA alpha for arrival rate estimation
  lambda_ewma_alpha: 0.2

  # `all` requires every instance at full load. `any` requires one.
  full_load_mode: any

# Number for rollout instances
n_rollout_instances: 1

# Number for validation rollout instances
n_validate_instances: 1

# Node number for each rollout instance
rollout_nnodes_per_instance: 1

# GPU number for each rollout instance in every node
rollout_ngpus_per_node_per_instance: 1

# Node number for each validate instance
validate_nnodes_per_instance: 1

# GPU number for each validate instance in every node
validate_ngpus_per_node_per_instance: 1

# Node number for trainer
train_nnodes: 1

# GPU number for trainer in every node
train_ngpus_per_node: 1

# Restrict scheduling to this many GPU nodes across all roles.
# Use null for no restriction.
total_nnodes: null

# Rollout with heterogeneous strategies across different instances
heterogeneous_rollout:

  # Whether to enable heterogeneous strategies for different rollout instances.
  enable: False

  # Number for rollout instances
  n_rollout_instances: ${psrl.deployment.n_rollout_instances}

  # Node number for each rollout instance
  rollout_nnodes_per_instance: []

  # GPU number for each rollout instance in every node
  rollout_ngpus_per_node_per_instance: []

  # Tensor model parallel size for each rollout instance.
  tensor_model_parallel_size_per_instance: []

  # Pipeline model parallel size for each rollout instance.
  pipeline_model_parallel_size_per_instance: []
