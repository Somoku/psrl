# Offload vLLM KV cache to preserve prefixes across multi-turn agent loops.

# Whether to enable LMCache KV offloading in vLLM.
enable: False

# --- L1 cache ---

# L1 capacity in GiB for one node's MP server.
offload_size_gb: 100.0

# Token chunk size for hash-based KV indexing (must divide the block size).
chunk_size: 256

# Chunk-key hash algorithm: "blake3" or "sha256".
hash_algorithm: blake3

# L1 allocation alignment in bytes. Raise it to 65536 when P2P is enabled so
# RDMA reads stay efficient.
l1_align_bytes: 4096

# L1 eviction policy: "LRU", "IsolatedLRU", or "noop".
eviction_policy: LRU

# Grow the L1 allocation on demand instead of committing all of the cap up front.
l1_use_lazy: True

# L1 GiB committed at startup when lazy allocation is on.
l1_init_size_gb: 20

# --- L2 (optional extra tiers) ---

# L2 adapters as JSON objects, e.g. [{type: fs, path: /mnt/kv}].
l2_adapters: []

# L2 store and prefetch policies (LMCache adapter registry names).
l2_store_policy: default
l2_prefetch_policy: default

# --- Runtime endpoints (allocated by the server actor at launch) ---

# Host the MP server binds for its worker message queue.
server_host: 127.0.0.1

# ZMQ message-queue port. Zero allocates one at launch.
server_port: 0

# Management HTTP port. Zero allocates one at launch.
http_port: 0

# --- P2P transfer ---

# Enable peer-to-peer KV sharing between instances.
enable_p2p: False

# Node IP advertised for the RDMA transfer channel (set at launch).
p2p_advertise_host: ""

# Transfer-channel port. Zero allocates one at launch.
p2p_transfer_port: 0

# Transfer engine: "nixl" (default) or "mooncake_te".
p2p_transfer_engine: nixl

# Peer lookup and load timeouts in seconds.
p2p_lookup_timeout_s: 30.0
p2p_load_timeout_s: 30.0

# --- Coordinator ---

# Host where the shared MP coordinator runs. Defaults to the PS manager node.
coordinator_host: ${psrl.ps_manager_ip}

# Coordinator HTTP port.
coordinator_port: 9300

# Coordinator startup timeout in seconds for contended manager nodes.
coordinator_health_timeout_s: 3000

# Report cache events to the coordinator. Required for fleet-level views and
# for the LMCache-tier KV event stream consumed by routing.
coordinator_event_reporting: False

# --- Connector ---

# Timeout in seconds for MP message-queue requests.
mq_timeout_s: 300

# Every MP server backing one replica, ordered by node rank, as "host:port".
# Empty keeps the replica a single-server deployment for kv_rank purposes.
mp_server_urls: []

# Interval in seconds between connector heartbeats to the MP server.
heartbeat_interval_s: 10

# Submit the LMCache lookup as soon as a request is scheduled.
eager_prefetch: False

# --- Cache behaviour ---

# Whether to clear stale KV cache after model weight pull from PS.
clear_on_weight_update: False

# Whether to tag KV entries with the model version. Required when P2P is
# enabled because the P2P tier cannot be cleared during weight sync.
multi_version_kv: True

# Publish KV cache events so routing can score the off-GPU cache tier.
enable_kv_events: False

# --- GPU pin budget ---

# Max pinned GPU KV blocks, oldest released first. Zero disables the limit.
gpu_pin_block_budget: 0
