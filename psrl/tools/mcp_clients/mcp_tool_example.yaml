# Example: enable MCP tools in ToolEnvironment via MultiTurnConfig.tool_config_path
#
# Usage:
#   Set config.gen_actor_rollout_ref.rollout.multi_turn.tool_config_path to this file.
#   Provide a valid mcp_server.json (url + auth_token) alongside this yaml.
#   Optionally set config.gen_actor_rollout_ref.rollout.multi_turn.return_tool_metadata=true
#   to include tool metadata as a separate field in tool messages.
#
# Notes:
# - tools are discovered dynamically from MCP servers.
# - tool_selected_list is optional; recommended to reduce schema size.

tools:
  - tool_name: mcp
    params:
      type: mcp
      mcp_servers_config_path: ./mcp_server.json
      tool_selected_list: []
      rate_limit: 120
      timeout: 30
