# NIXL config for `nixl_cpu` weight synchronization

# Server IP address
server_ip: ${psrl.ps_manager_ip}

# Server port
server_port: 23456

# Pinned temp memory slots num for non-contiguous transfer
max_pinned_temp_memory_slots: 16

# Enable TMS management for NIXL temp buffers
enable_tms_for_temp_buffers: ${psrl.tms.enable_nixl}

# Per-shard weight version stamps (3.4 "版本相等性").
#
# Direct supply removes the PS as the place to ask "which version is this", so the stamp
# travels with the shard. The checks are metadata-only -- O(1) per shard, independent of
# model size, dtype and quantisation -- which is why they are on rather than opt-in:
# measured 0.06 ms per publish for an 8B model, against ~61 s to hash its contents.
#
# They catch stale, torn and misdirected reads. They do not catch bit corruption of
# correctly-versioned bytes, which the NIC already checksums.

# How long each NIXL handshake phase waits for its clients, in seconds.
#
# Startup, not transport: the clock starts when the meta server begins waiting and the
# clients are still bringing vLLM up behind it. Measured on a 5-node Qwen3-8B run,
# reaching the handshake took 18.6 min once and 23.5 min the next time -- same code, same
# cluster -- so a budget tight enough to fit the first loses the second to a run that was
# working. Raise it on slow or contended clusters; a handshake that is genuinely broken
# fails on its own, not by waiting longer.
handshake_timeout_s: 1800

# Whether same node rollouts with identical shards share one upstream read per key and
# read the rest from each other over NVLink. Cuts trainer egress to one copy per node.
peer_diffusion: True

# Bytes of the rollout side staging pool, split into two alternating slots. Shards whose
# local layout is fragmented are read into it and scattered locally.
pull_staging_bytes: 268435456

# How long a rollout waits for its designate before reading that designate's keys upstream.
peer_timeout_s: 120

# MiB a train rank may spend on contiguous copies of shards that rollouts cut finer than it does.
# Each copy turns a read of one descriptor per row into one descriptor. Past the budget rollouts
# span read the shard instead, which moves more bytes. null is unbounded.
publish_copy_budget_mb: null

# Resolved by `validate_config` under direct supply: the dtype the trainer stores and the one
# the rollout loads. When they differ the trainer publishes contiguous copies cast to the latter.
publish_train_dtype: null
publish_rollout_dtype: null

# Whether publishing waits for readers of the previous version to drain (item E1).
#
# `auto` means "decide from the backend and precision"; `validate_config` replaces it and
# the resolved boolean is what a dumped config shows. Set it to an explicit true/false to
# override -- which is what the E1 criterion needs, since observing weight corruption by
# turning the barrier *off* is the only way to show the barrier is doing anything.
#
# Needed when publishing overwrites memory a rollout may be reading. Under FSDP2 at
# matched precision that is the whole optimizer step, because there are no master
# parameters -- the live weights *are* what gets written. On a cast path the rollout reads
# a separate quantised buffer, and under colocate rollout is paused for the duration, so
# both are structurally safe and this stays False.
await_readers_before_publish: auto

# How long that wait may last, in milliseconds.
#
# Bounded on purpose: a budget that can reach a step's duration would delay every publish
# to close a race that lasts microseconds. Past the budget the publish proceeds and the
# previous version is marked invalid, which readers detect and answer by re-pulling the
# newer version -- a strictly better model, so the fallback is an algorithmic improvement
# rather than a stall.
conflict_wait_budget_ms: 50.0
