# @package _global_
#
# FSDP2 at matched bf16 precision, direct supply (item T4, and E1's criterion).
#
# This is the cell that makes the version barrier mandatory: FSDP2 has no master
# parameters, so the whole optimizer step writes the memory a rollout may be reading,
# rather than only a narrow write-back instant. Matching train/gen precision is what puts
# them on the same buffer -- a cast path reads a separate quantised copy and has no shared
# memory to protect, which is why `requires_version_barrier` returns False there.
#
# Derived from nixl_e2e_5node_direct.yaml, which is already bf16/bf16, so the only
# difference is the training backend. Keeping everything else identical is what makes a
# result attributable to the backend.
#
# The PS nodes the other config allocates are simply not created here, so this run
# uses 5 nodes for compute where the PS variant used 5 plus PS actors colocated on the
# gen nodes.
defaults:
  - _self_

test:
  # 16 GPUs across 2 nodes: FSDP2 shards over the whole train world, so its size is
  # free -- unlike Megatron, whose TP x PP x CP must divide it.
  num_train: 8
  num_gen: 8
  train_engine_type: fsdp2

  # No PS workers, no push step: the rollout reads the trainer directly.
  direct_supply: true

  fsdp_hybrid:
    ddp_size: 2
    fsdp_size: 4

  megatron:
    tensor_model_parallel_size: 4
    pipeline_model_parallel_size: 2
    virtual_pipeline_model_parallel_size: 1
    context_parallel_size: 1
    expert_model_parallel_size: 1
    expert_tensor_parallel_size: 1

  gen:
    tensor_parallel_size: 2
    pipeline_parallel_size: 1
    expert_parallel_size: 1
    # Written out rather than left as 1: 8 gen / (TP=2 x PP=1) = 4, and the validator
    # only cross-checks this when it is > 1, so leaving the inherited default would mean
    # nobody checks the arithmetic.
    data_parallel_size: 4

model:
  # Qwen3-8B: GQA (32 heads / 8 kv heads), the layout that exposed the
  # ConcatenatedQKVSync cat-dimension bug.
  path: ${oc.env:PSRL_WORKSPACE}/models/Qwen3-8B
  trust_remote_code: false
  train_dtype: bfloat16
  gen_dtype: bfloat16

logging:
  path: ${oc.env:PSRL_WORKSPACE}/psrl/unit_tests/nixl/log_fsdp2
  level: INFO

network:
  listen_ip: ${oc.env:LOCAL_IP}
  listen_port: 23461
  torch_port_train: 29504
  torch_port_gen: 29505
  backend: nccl

nixl:
  server_mode: meta_server
  server_ip: ${network.listen_ip}
  server_port: ${network.listen_port}
  max_pinned_temp_memory_slots: 4
  enable_tms_for_temp_buffers: False
  # Rollouts here are pure destinations: peer diffusion is off (see below), so nothing
  # reads their shards. That lets a row-parallel shard be staged contiguously -- one
  # descriptor instead of one per row. On Qwen3-8B that is 144 x 4096 descriptors
  # (~1.2s of submission at the measured 2.1us each) collapsing to 144.
  #
  # Must be True wherever something does read this client, or the read fails: a staged
  # shard has no remote descriptor.
  shards_must_be_readable: False
  # Off, and it has to be: a diffusion designate is read from, so it could not stage.
  # Measured on this config, diffusion was 1.42-1.93x *slower* than not diffusing,
  # because a designate pays one descriptor per strided row either way -- it only moves
  # which link pays for them. Staging removes the descriptors instead.
  peer_diffusion: False

ps:
  mode: nixl_cpu
