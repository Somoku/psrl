# TITO trajectory assignment: manual reads x-smg-tito-trajectory-id (default 0),
# while auto derives IDs from matching prefix-tree leaves inside SMG.
trajectory_id_strategy: manual

# rust: SMG preprocesses pixels (fast); python: forward HF tensors (exact).
multimodal_preprocessing: rust

# SMG -> vLLM tensor transport. auto uses /dev/shm only after SMG verifies
# that the selected worker shares the namespace; otherwise it stays inline.
multimodal_tensor_transport: auto
multimodal_shm_min_bytes: 65536

# Max HTTP generation concurrency per rollout server.
# The global HTTP budget is
# server_max_concurrency * number_of_active_rollout_servers.
server_max_concurrency: 256

# Whether AgentLoopWorkers should route POST requests through a Ray actor pool.
# The pool is created by AgentLoopManager and selected with round-robin.
use_distributed_post: False

# Number of HTTP POST actors to place on each alive Ray node when
# use_distributed_post is enabled.
post_actor_num_per_node: 8

# Per-module Rust log filter for the SMG gateway process (RUST_LOG syntax).
# Overrides the default log_level=warn when set. Use tracing directive syntax.
# Empty string "" means no override (use default warn level).
rust_log_filter: "warn,smg::routers::grpc::kv_transfer=warn,smg::routers::grpc::common::stages::worker_selector::psrl=warn,route_trace=info,score_trace=info"

# Wait for local VllmEngine.HealthCheck before POST /workers to SMG gateway.
grpc_registration_health_timeout_s: 300
grpc_registration_health_poll_interval_s: 1.0
grpc_registration_health_rpc_timeout_s: 5.0

# Serve SubscribeKvEvents through a buffering KvEventReplayHub so the gateway
# can replay missed sequences after a gap. When False (default), use the
# original per-subscription inline ZMQ loop with no buffering.
#
# Default is False: the gateway's KV-event monitor now tolerates seq gaps
# (monotonic acceptance, no reconnect/resync storm), so the hub's only purpose
# — replaying missed sequences to keep seq strictly contiguous — is no longer
# needed. The inline path is simpler, has no ingester-thread overhead, and was
# verified to give ~100% cache-overlap routing. The hub path is retained for
# opt-in use but currently exhibits a 0-overlap indexing bug under investigation.
enable_kv_event_replay: False
