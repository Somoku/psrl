[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sandboxd"
version = "0.1.0"
description = "Python SDK for the sandboxd sandbox service"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["sandboxd*"]
