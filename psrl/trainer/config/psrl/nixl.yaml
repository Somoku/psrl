# NIXL config for `nixl_cpu` weight synchronization

# Server IP address
server_ip: ${psrl.ps_manager_ip}

# Server port
server_port: 23456

# Pinned temp memory slots num for non-contiguous transfer
max_pinned_temp_memory_slots: 16

# Enable TMS management for NIXL temp buffers
enable_tms_for_temp_buffers: ${psrl.tms.enable_nixl}

# Per-shard weight version stamps (3.4 "版本相等性").
#
# Direct supply removes the PS as the place to ask "which version is this", so the stamp
# travels with the shard. The checks are metadata-only -- O(1) per shard, independent of
# model size, dtype and quantisation -- which is why they are on rather than opt-in:
# measured 0.06 ms per publish for an 8B model, against ~61 s to hash its contents.
#
# They catch stale, torn and misdirected reads. They do not catch bit corruption of
# correctly-versioned bytes, which the NIC already checksums.

# How long each NIXL handshake phase waits for its clients, in seconds.
#
# Startup, not transport: the clock starts when the meta server begins waiting and the
# clients are still bringing vLLM up behind it. Measured on a 5-node Qwen3-8B run,
# reaching the handshake took 18.6 min once and 23.5 min the next time -- same code, same
# cluster -- so a budget tight enough to fit the first loses the second to a run that was
# working. Raise it on slow or contended clusters; a handshake that is genuinely broken
# fails on its own, not by waiting longer.
handshake_timeout_s: 1800
