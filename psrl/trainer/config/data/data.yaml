defaults:
  - legacy_data
  - _self_

# Use multi-dataset mode, fallback to veRL legacy mode if False.
use_multi_dataset: False

# Multiprocessing reduces filtering time for large datasets.
filter_overlong_prompts_workers: 32

reward_model_dicts:
  - reward_fn_key: data_source
    reward_loop_type: naive
    reward_fn: default
    reward_model_name: null
    reward_coef: 1.0

train_datas:
  - file: /jizhicfs/pkuhetu/yfzhao/psrl/data/gsm8k_verl/train.parquet
    data_source_name: openai/gsm8k
    prompt_key: prompt
    max_samples: -1
    reward_model_dicts:
      - reward_fn_key: data_source
        reward_loop_type: naive
        reward_fn: default
        reward_model_name: null
        reward_coef: 1.0

# Sampling ratios must align with `train_datas` and sum to approximately one.
train_datasets_ratios: [1.0]

# Validation entries share the training schema, but route rewards only during evaluation.
val_datas:
  - file: /jizhicfs/pkuhetu/yfzhao/psrl/data/gsm8k_verl/test.parquet
    prompt_key: prompt
    max_samples: -1
    reward_model_dicts:
      - reward_fn_key: data_source
        reward_loop_type: naive
        reward_fn: default
        reward_model_name: null
        reward_coef: 1.0
