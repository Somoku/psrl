# N independent replicas on one host, each with its own port and GPU block.
#
# This exists instead of vLLM's --data-parallel-size, which is broken in this
# repo's patched build (the DP coordinator never reports its ZMQ addresses).
# Independent replicas also fail independently, so one wedged replica costs its
# own share of capacity rather than the whole server.
#
# Defaults suit an 8-GPU host: 4 replicas x TP=2. Total endpoints = replicas.
kind: fleet

replicas: 4
tp: 2
pp: 1

# In-process data parallelism. Leave at 1: independent replicas are the whole
# point of this topology, and this repo's vLLM has a broken DP coordinator.
dp: 1

# Ports base_port .. base_port + replicas - 1.
base_port: 8000

# Empty discovers the local GPUs. Must satisfy len(gpu_ids) == replicas * tp * pp.
gpu_ids: []

host: 0.0.0.0

wait_ready_sec: 4500

# Require every replica. On a single host a missing replica almost always means a
# real misconfiguration (wrong GPU count, out of memory) rather than the transient
# flakiness expected across many nodes.
min_healthy_frac: 1.0
