defaults:
  - server: qwen35_9b
  - topology: fleet
  - _self_

# Where endpoints.json, replica logs, and the resolved config are written. Must
# be on shared storage for topology=multinode, since every host writes into it.
output_dir: ???

# Sourced by each replica before exec'ing vLLM. It activates conda and sets the
# NCCL / UCX / cudnn library paths vLLM needs, so an empty value only works if
# the launching shell already has all of that.
env_script: /apdcephfs_zwfy10/share_303541817/lhy/env/psrl.sh

# Print what would launch, then exit without starting anything.
dry_run: false

# Block until every server is torn down. false returns immediately and leaves
# them running, which is what an eval wrapper wants.
wait_forever: false

hydra:
  # Pin the run directory. By default Hydra creates outputs/<date>/<time>/ in the
  # launch directory, which scatters artifacts away from the eval that produced
  # them.
  run:
    dir: ${output_dir}
  output_subdir: .hydra
  job:
    chdir: false
