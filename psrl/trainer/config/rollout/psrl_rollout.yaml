# Extend veRL's `rollout.yaml` with PSRL-only fields.

defaults:

  # Load veRL's canonical rollout config first (via the sibling symlink verl's rollout.yaml).
  - rollout

  # Apply PSRL overrides/extensions last.
  - _self_

# Target class for this configuration (PSRL's extended RolloutConfig).
_target_: psrl.workers.config.RolloutConfig

# PSRL only support vllm backend.
name: vllm

# Async mode in PSRL
mode: psrl_async

# logprobs mode for rollout logprobs
logprobs_mode: raw_logprobs

# Select the rollout weight loader. Large safetensors models should set `use_shm=True`.
load_format: dummy

# Whether disable attention for profiling.
disable_attn: ${oc.select:psrl.profile.disable_attn,False}

# Disable logging statistics.
disable_log_stats: False

# Max length of sequences.
max_num_seqs: ${oc.select:psrl.rollout_coordination.routing_strategy.max_concurrent_seqs_per_instance,1024}

# vLLM runner type: 'generate' for autoregressive LLMs, 'pooling' for
# embedding / reward / classification models.
runner: generate

# vLLM task type forwarded to the engine (e.g., 'generate', 'classify', 'embed').
task: generate

# Number of rollouts to run per sample.
n: ${oc.select:psrl.rollout_n}

# Pooling params for vLLM-based pooling reward models.
reward_kwargs:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs.
  _target_: psrl.workers.config.PoolingConfig

  # Whether to L2-normalise the output embedding vector.
  normalize: False

  # Whether to apply an activation function (e.g., sigmoid) to the logit output.
  use_activation: False

# (TMS-only) Whether to enable offloading weights (level-1 sleep) to CPU.
enable_weights_cpu_backup: False

# Multi-turn interaction config for tools or chat.
multi_turn:

  # Required when using psrl.utils.omega_conf_to_dataclass to instantiate dataclass configs
  _target_: psrl.workers.config.MultiTurnConfig

  # Enable multi-turn tool interactions and use the compatible rollout backend.
  enable: False

  # null for no limit (default max_length // 3)
  max_turns: null

  # Native `Tool` configuration for stateful lifecycle hooks or custom rewards.
  # Null disables this path.
  tool_config_path: null

  # Python file containing stateless `@function_tool` functions.
  # Names must not collide with `tool_config_path`. Null disables this path.
  function_tool_path: null

  # max parallel call for tools in single turn
  max_parallel_calls: 1

  # max length of tool response
  max_tool_response_length: 256

  # truncate side of tool response: left, middle, right
  tool_response_truncate_side: middle

  # Use the model's chat template instead of recorded training token IDs.
  use_inference_chat_template: False

  # Compare turn-wise tokenization with full-conversation tokenization.
  # Modes are `disable`, `strict`, and `ignore_strippable`.
  tokenization_sanity_check_mode: strict

  # Format of the multi-turn interaction. Options: hermes, gpt-oss, qwen3_coder, gemma4.
  format: hermes

# [PSRL] Agent loop configuration (overrides veRL's AgentLoopConfig with PSRL variant).
agent:

  # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs.
  _target_: psrl.workers.config.AgentLoopConfig

  # Number of agent loop workers.
  num_workers: 1

  # Node IPs allowed to host agent loop workers. Empty uses every alive node.
  node_ips: []

  # DAPO Overlong Filtering: drop budget-truncated trajectories from the loss while keeping
  # their reward in the GRPO group baseline, unlike the reward manager's soft length penalty.
  overlong_filtering: False

  # Custom agent loop config path (list of AgentLoop configs to instantiate).
  agent_loop_config_path: null

  # Routing strategy for distributing requests across agent loop workers.
  route_strategy: round_robin

  # Custom async server configs.
  custom_async_server:

    # Required when using verl.utils.omega_conf_to_dataclass to instantiate dataclass configs.
    _target_: verl.workers.config.CustomAsyncServerConfig

    # Path to the custom async server implementation.
    path: null

    # Class name of the custom async server class (e.g. AsyncvLLMServer).
    name: null

  # Episode seconds after provisioning, including turns, patch collection, and grading.
  # Other deadlines derive from this budget. Null uses the default.
  trajectory_timeout: 7200

  # Environment configuration for the agent loop.
  env:

    # Environment class name.
    name: null

    # Timeout (in seconds) for each step in the environment.
    step_timeout: null

  # Agent data configuration for the agent loop.
  data:

    # Agent data class name.
    name: null

  # Worker-local registry of hot-pluggable sandbox backends. Docker is the
  # default so code-executing loops cannot silently bypass SandboxManager.
  sandbox:

    _target_: psrl.sandbox.config.SandboxManagerConfig
    # Keep backend definitions declarative until the worker builds its sandbox manager, so
    # runtime objects such as Docker clients and metrics locks never enter `RolloutConfig`.
    _recursive_: false

    default_backend: docker

    # One node envelope shared by every Docker sandbox on that node. Null uses the node's
    # cgroup/machine limit and utilization is the sole safety margin.
    capacity:
      memory_mb: null
      cpu_cores: null
      # Raised together with the class guarantees below: a queued class's guarantee is held
      # out of a borrower's reach, so reserving 45% for grading only leaves the rollout
      # class enough absolute room if the envelope itself is larger.
      utilization: 0.8

      # Accelerator devices and sandbox disk are declared, not detected: a device count
      # cannot be inferred from a host, and devices are never overcommitted once running.
      gpu_count: null
      disk_mb: null

      # Memory is the only dimension that can be admitted above its reservation, because a
      # waiting agent's pages are reclaimable. Raise this only against the OOM counter.
      memory_overcommit_ratio: 1.0

      # Member requests wait this fraction of the deadline above, so a capacity shortage
      # costs an episode retry instead of holding a whole phase.
      acquire_deadline_fraction: 1.0

      # Guarantees must sum to below one; what is left over is the elastic pool, and it is
      # the only capacity a class may borrow. A class can never take another class's unused
      # guarantee, so an undersized share starves that class even while the node looks busy
      # rather than full.
      #
      # Size the shares from measurement, not intuition. When both roles request the same
      # per-sandbox reservation, which is the usual case, a share is just the number of
      # sandboxes that phase needs at once: size it from phase concurrency, not phase
      # footprint. Both are in `reward_info.timing.elapsed_s` / `grading_s`, and
      # `sandbox_peak_memory_mib` when sandbox_config.collect_resource_metrics is on.
      classes:
        # Recipes declare the resource class for each phase. Rollout is the long phase and
        # runs at the agent loop's full concurrency; grading is brief but arrives in bursts
        # as a batch finishes together, so it needs a real reserve rather than a remainder.
        rollout:
          guaranteed_share: 0.45
        grader:
          guaranteed_share: 0.45

      # Maximum admission wait in seconds. The agent loop refuses a deadline at or above
      # `trajectory_timeout`, because a request that queues longer than it would work is a
      # capacity fault rather than a wait. Null waits indefinitely.
      acquire_timeout_s: 1800

    # Idle windows derive from the one number an operator can estimate: episode length.
    # The pause, reap, and lifetime windows follow in order, or are asserted if named directly.
    timing:
      episode_deadline_s: null
      pause_after_episodes: 2.0
      reap_after_pause_windows: 3.0
      lifetime_after_reap_windows: 4.0

    backends:

      docker:
        _target_: psrl.sandbox.backends.DockerBackend

        # One exec interface, two strategies. A multi-turn harness keeps a login shell for
        # stateful turns, while single-command workloads skip it. A spec may override this.
        default_exec_mode: persistent

        # Longest stretch with no output at all before a command is treated as stuck rather
        # than slow. Null waits for the deadline only.
        silence_timeout_s: 900

        # Character budget for each end of an observation. The head carries the command echo
        # and the early errors, the tail carries the final result. Zero keeps everything.
        max_observation_chars: 20000

        # Seconds to wait for a new sandbox to answer a command. A running container is not
        # the same as a usable one.
        startup_timeout_s: 300

        # Host firewall command used to enforce a per-sandbox egress allowlist. Egress is
        # declared only where it can be enforced, never started open.
        egress_firewall_command: iptables

        # One owner lease per worker drives node-level garbage collection. The lease directory
        # must be visible to every worker using the same daemon, and mounted when containerized.
        lifecycle:
          heartbeat_dir: /tmp/psrl-sandbox-heartbeats

          # How long a container may stay stopped before the collector reaps it despite a live
          # owner. Must outlast the owning session's exit diagnosis, which takes seconds.
          stopped_grace_s: 300

        # Rootless is opt-in because existing clusters may still use a rootful
        # node-local daemon. Set require_rootless=true after daemon migration.
        security:
          require_rootless: false
          pids_limit: 4096
          cap_drop:
            - ALL
          cap_add: []
          no_new_privileges: true
          read_only_rootfs: false

        policy_profiles:

          # Keep sandbox traffic isolated while making node-local services and
          # loopback proxy URLs reachable through one stable hostname.
          mini_swe:
            network_mode: bridge
            host_gateway_alias: host.docker.internal
            rewrite_loopback_proxies: true

          # AIRS-Bench runs its services on the host, so the profile is host networking
          # plus the loopback proxy rewrite the harness needs.
          airs_bench:
            network_mode: host
            host_gateway_alias: host.docker.internal
            rewrite_loopback_proxies: true
            # Allow setuid/sudo inside the task container. Linux capabilities
            # remain dropped unless explicitly added above.
            no_new_privileges: false

  # Maximum number of retries for each trajectory in case of failures.
  retry_limit: 1

  # Whether to raise error in agent loop.
  raise_on_error: True

  # Discount factor for Monte Carlo return calculation in reward.
  gamma: 0.0

  # Coefficient for reward bonus shaping.
  reward_bonus_coeff: 0.0

  # Trajectory reward calculation mode: 'step' or 'traj'.
  traj_reward_mode: traj

  # Default agent loop name
  default_agent_loop: generate_only_agent
