[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psrl"
version = "0.0.1"
description = "PSRL is a post-training framework for LLMs that supports both synchronous and asynchronous training paradigms through staleness control, streaming rollout and parameter server architecture."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
]

[project.urls]
Homepage="https://github.com/lhy101/psrl"

[tool.setuptools]
package-dir = {"" = "."}
packages = ["psrl"]
include-package-data = true

[tool.setuptools.package-data]
psrl = ["trainer/config/*.yaml"] 