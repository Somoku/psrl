# Agent loop config for the SciAccel-RL v2 task bank.
# Harbor paths and timeout budgets are configured for the v2 task bank.
- name: sciaccel
  _target_: examples.sciaccel_rl.agent_loop.SciAccelAgentLoop
  harbor:
    # Store per-episode Harbor artifacts on local disk to avoid shared filesystem
    # inode accounting failures.
    jobs_dir: /tmp/sciaccel_jobs_v2
    # Harbor treats a name containing ':' as an import path, which is how the local
    # subclass replaces stock terminus-2 without patching the installed package.
    agent_name: examples.sciaccel_rl.agent:TruncatingTerminus2
    # Terminal output was 57% of trajectory bytes at harbor's 10000 default, and the
    # graded sources are 15 KB to 40 KB, so no cap makes a whole file readable anyway.
    # Spend the window on turns instead of on one careless `cat`.
    max_observation_bytes: 4096
    # Left at the task-declared 8192 MB. Raising this to 16384 backfired and was
    # reverted: it applies to `services.main` (the agent) while the OOM happens in the
    # verifier, so the kills continued and `mhd.exe` simply grew into the new ceiling
    # (16.7 GB resident at OOM). Worse, it turned a fast failure into a 115 minute one,
    # because a solver killed mid-run leaves the verifier waiting until its 900 s budget
    # and then the outer 6900 s backstop expire, holding a rollout slot the whole time.
    # Job timeouts went from 0 in 3915 episodes to 13 in 253. Fix the rank count or the
    # verifier service limit instead, and measure before trusting it.
    memory_mb_override: 0
    # Hard ceiling on concurrent Harbor episodes per agent loop worker, released only
    # after that episode's containers are torn down. Measured: a clean daemon starts 16
    # containers in 2 s, and one node that had accumulated 89 orphaned FUSE mounts could
    # not start 16 within 280 s. Without this cap admission allowed roughly 256 requests
    # and one node reached 182 containers, which wedged its daemon.
    max_concurrent_episodes: 16
    override_gpus: null
    gpu_compose_override: ""
  # Harbor enforces this external budget so agents cannot forge the clock.
  # Revisit it when admission limits, batch size, or engine count changes.
  #
  # 2700 s (45 min), down from 5400. Reward collapses with episode duration: mean
  # reward is 0.66 under 30 min, 0.39 from 30 to 45, then 0.21 from 45 to 60 and 0.03
  # past 90. A long episode is a stuck episode, not a thorough one, so the budget was
  # paying 1.5 to 2 hours per slot for work that almost never scores. Cutting to 45 min
  # drops 24% of slot-time while keeping 91% of the reward, which is 1.2x more reward
  # per slot-hour. It does truncate 11% of voluntarily-finished episodes, so watch the
  # `finished` share: if it falls materially, 3600 is the next rung up.
  task_timeout_sec: 2700.0
  # Only sizes PSRL's outer backstop, so it must be >= the task's own
  # [verifier] timeout_sec (900 for LAPS) or that guard can pre-empt grading.
  verifier_timeout_sec: 900.0
