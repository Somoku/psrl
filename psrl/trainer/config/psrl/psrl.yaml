defaults:
  - rollout_coordination/routing_strategy@rollout_coordination.routing_strategy
  - rollout_coordination/sync_and_mig_strategy@rollout_coordination.sync_and_mig_strategy
  - rollout_coordination/partial_rollout@rollout_coordination.partial_rollout
  - rollout_coordination/redundant_rollout@rollout_coordination.redundant_rollout
  - rollout_coordination/proactive_filter_strategy@rollout_coordination.proactive_filter_strategy
  - rollout_coordination/session_strategy@rollout_coordination.session_strategy
  - _self_

# Whether colocate rollout and trian workers
colocate: False

# IP address of parameter server managaer.
ps_manager_ip: 127.0.0.1

# IP address of reward service.
reward_service_ip: ${psrl.ps_manager_ip}

# Staleness control of training data.
staleness: 0

# Size of each staleness buffer (i.e. training batch)
staleness_buffer_entries: 512

# number of responses (i.e. num sample times). > 1 for grpo
rollout_n: 1

# Weight synchronization mode for parameter server: cpu_ref or nixl_cpu
ps_mode: cpu_ref

# Logging path
logging_path: ~/psrl_logs

# Agentic RL feature toggles.
agentic_rl:

  # Error handling for terminations where TerminateReason.needs_manager_retry()
  # is True -- i.e. ROLLOUT_ERROR (rollout call raised) and UNKNOWN
  # (unclassified failure / zero turns produced). Timeouts and aborts are
  # handled by their own paths and do NOT route through this switch.
  # True  (default): on training failure, worker notifies manager to dispatch a
  #                  replacement request so the buffer slot is eventually filled;
  #                  on validation failure, manager shrinks val_buffer_size by 1
  #                  so the waiter is unblocked (result has fewer rows).
  # False           : raise RuntimeError immediately, crashing the worker so the
  #                   failure is visible rather than silently stalling training.
  manager_retry_on_error: True

  # Per-trajectory text dump written by all agent loops via TrajectoryWriter.
  # Files land at <dir>/v{version}/{uid}.txt (one per rollout trajectory).
  trajectory_output:
    # Whether to write per-trajectory text files.
    enable: True
    # Output directory. Empty -> <psrl.logging_path>/trajectories.
    dir: ""

  # TODO(lhy): move multi-turn agent settings from rollout.yaml to psrl.yaml

server_rollout:

  # Whether to enable server rollout service.
  enable: False

  # Rollout gateway config.
  # This gateway is an HTTP entrypoint used by agent loops to call rollout service.
  gateway:

    # Bind address for the gateway process.
    router_ip: ${psrl.ps_manager_ip}

    router_port: 18080

  # Max concurrent connections per rollout server for the HTTP client.
  server_concurrency: 64

# Config for profile
profile:

  # Whether to disable the attention in Qwen2.5
  disable_attn: False

  # Whether to fix the weight of the model
  # Useful for analysis
  fix_weight: False

# Config for logprobs
log_prob:

  # Whether to return logprobs from rollout engines
  enable_rollout_engine_log_prob: True

# Worker deployment and resource allocation
deployment:

  # auto-scaling between rollout and reward model
  elastic_rm:
    # Whether to enable auto-scaling between rollout and reward model
    enable: False

    # Number of nodes for shared resource pool
    shared_nnodes: 1

    # GPU number for each node in shared resource pool
    shared_ngpus_per_node: 8

    # Whether to enable policy-based scaling decisions in ElasticExecutor monitor loop
    enable_policy: True

    # Monitor interval for elastic policy loop
    monitor_interval_ms: 1000

    # Max seconds per monitor tick to wait on coordinator Ray RPCs (engine snapshot + router backlog).
    # Prevents the monitor from hanging silently if a coordinator/router blocks; <=0 disables the cap.
    coordinator_sync_timeout_s: 10

    # Max seconds for each SLEEP/WAKE_UP/ABORT exec_command from ElasticExecutor to a coordinator.
    # Omit or 0 = wait indefinitely. When set, avoids pending stuck forever if a worker/router hangs.
    coordinator_command_timeout_s: 300

    # Consecutive monitor ticks while policy is blocked by an unfinished scale decision; at this
    # count, clear local in-flight decision state so new scaling decisions can run. 0 = never abandon.
    # Rough wall time ≈ ticks * (monitor_interval_ms / 1000), e.g. 180 ticks @ 1000ms ≈ 3 minutes.
    decision_execution_abandon_stall_ticks: 180

    # KV cache utilization threshold below which an instance can cede resources
    theta_low: 0.1

    # KV cache utilization threshold above which an instance is considered full-load
    theta_max: 0.8

    # Cooldown window after each scaling action to avoid oscillation
    cooldown_ms: 10000

    # Minimum bottleneck throughput gain required for one-step transfer
    hysteresis: 0.05

    # Minimum number of awake instances kept for each role.
    # Set to 0 to allow one side to fully sleep.
    min_awake_per_role: 1

    # Priority-3 scale-down guard: even if KV cache is below theta_low, do not shrink if the
    # selected scale-down candidate still has too many requests waiting in its local queue.
    # 0 means: candidate must have no waiting requests to be shrinkable.
    max_waiting_queue_for_scale_down: 64

    # After scale-up: fraction [0,1] of each instance's waiting-queue uids to ABORT for
    # load rebalancing. FIFO (head of req_id_in_waiting, queue order): k = floor(n * ratio). 0 disables; 1 aborts all.
    post_scale_up_abort_waiting_ratio: 0.8

    # Optional map {model_name: profile_json_path} for new throughput profile schema
    profile_paths: {}

    # Throughput-model directory containing {model_name}_token.json and fitted formula
    throughput_model_dir: psrl/config/throughput_model

    # Use token-throughput fit bucket by output length (default 1024)
    throughput_model_output_len: 1024

    # EWMA alpha for arrival rate estimation
    lambda_ewma_alpha: 0.2

    # Full load mode for scaling policy
    # Available options: "all", "any"
    # "all": all instances must be full load to scale up
    # "any": any instance can be full load to scale up
    full_load_mode: any

  # Number for rollout instances
  n_rollout_instances: 1

  # Number for validation rollout instances
  n_validate_instances: 1

  # Node number for each rollout instance
  rollout_nnodes_per_instance: 1

  # GPU number for each rollout instance in every node
  rollout_ngpus_per_node_per_instance: 1

  # Node number for each validate instance
  validate_nnodes_per_instance: 1

  # GPU number for each validate instance in every node
  validate_ngpus_per_node_per_instance: 1

  # Node number for trainer
  train_nnodes: 1

  # GPU number for trainer in every node
  train_ngpus_per_node: 1

  # Total number of GPU nodes this job needs across all roles.
  # When set, excess nodes in the Ray cluster are blocked from scheduling
  # so that colocated validate workers cannot spill onto idle nodes.
  # Set to the same value as NNODES in the launch script.
  # null means no restriction (default).
  total_nnodes: null
  
  # Rollout with heterogeneous strategies across different instances
  heterogeneous_rollout:

    # Whether to enable heterogeneous strategies for different rollout instances.
    enable: False

    # Number for rollout instances
    n_rollout_instances: ${psrl.deployment.n_rollout_instances}

    # Node number for each rollout instance
    rollout_nnodes_per_instance: []

    # GPU number for each rollout instance in every node
    rollout_ngpus_per_node_per_instance: []

    # Tensor model parallel size for each rollout instance.
    tensor_model_parallel_size_per_instance: []

    # Pipeline model parallel size for each rollout instance.
    pipeline_model_parallel_size_per_instance: []

# Collect rollout instance status to rollout coordinator for global dp load balance
status_collection:

  # whether to enable the status collection.
  enable: True

  # The level of logging to file
  # Available options: "none", "partial_rollout", "prompt", "generation", "all"
  dump_logging_to_file_level: all

  # Logging interval in milliseconds
  dump_logging_to_file_interval_in_ms: 500

  # Engine status sync interval in millisecond (each vllm engine -> rollout coordinator)
  # Here 10 means sync every 0.1 second
  engine_sync_interval_in_ms: 100

  # Coordinator sync interval in millisecond (rollout coordinator after collecting engine status from all vllm engines -> router)
  # Here 10 means sync every 0.1 second
  coordinator_sync_interval_in_ms: 100

  # Stats recorder config
  stats_recorder:

    # Whether to enable periodic per-replica JSONL stats dump.
    # When enabled, writes one file per (replica_id, dp_rank) to psrl.logging_path.
    enable: True

    # Snapshot interval in seconds
    interval_in_s: 1.0

# Memory logger config
memory_logger:

  # Whether to enable memory logger
  enable: False

  # Logging interval in seconds
  interval_seconds: 30

# NIXL config for `nixl_cpu` weight synchronization
nixl:

  # Server IP address
  server_ip: ${psrl.ps_manager_ip}

  # Server port
  server_port: 23456

  # Pinned temp memory slots num for non-contiguous transfer
  max_pinned_temp_memory_slots: 16

  # Enable TMS management for NIXL temp buffers
  enable_tms_for_temp_buffers: ${psrl.tms.enable_nixl}

# Broadcast initialization: rank-0 PS worker reads checkpoint, distributes to others via NIXL.
broadcast_init:

  # Set to true to use rank-0 broadcast initialization instead of each worker reading disk.
  enabled: True

  # Broadcast algorithm. Supported: binary_tree. Reserved for future: ring.
  algorithm: binary_tree

# Checkpoint strategy config
checkpoint:

  # Use DCP (verl's default dist_checkpointing) for save/load.
  # When False (default), uses PSRL's UCX-safe per-rank torch.save to avoid
  # NIXL background thread (enable_prog_thread) corruption during save.
  # When True: DCP is used with NCCL no-fork patch (applied automatically);
  # NIXL prog_thread is automatically disabled (enable_prog_thread=False)
  # to prevent UCX heap corruption from DCP's all_gather_object metadata gather.
  use_dcp_save: True

# Post processor for group requests in streaming mode
group_post_process:

  # Whether to enable group post-processing
  enable: False

  # Name of the registered group post-processor to use
  # Available options: "dynamic_sampling_filter", "no_filter"
  # When name is "dynamic_sampling_filter", requires algorithm.filter_groups.metric to be set
  name: null

# Post processor for buffer requests in batch mode
buffer_post_process:

  # Whether to enable buffer post-processing
  enable: False

  # Name of the registered buffer post-processor to use
  # Available options: "dynamic_sampling_filter", "no_filter"
  # When name is "dynamic_sampling_filter", requires algorithm.filter_groups.metric to be set
  name: null

# Buffer bound for retry mechanism
retry_bound: -1

# Ratio over retry bound
retry_ratio: 1.0

# Whether to colocate validate and training workers
colocate_validate_and_train: True

# Whether to dispatch requests to both rollout and validate instances
fuse_rollout_with_validate: True

# Whether to use torch_memory_saver (TMS) for GPU management
tms:

  # Range of TMS to enable, available options:
  #  - "null": disable TMS
  #  - "train": enable TMS for training workers only
  #  - "all": enable TMS for both rollout and training workers
  range: null

  # Whether to enable TMS on CUDA graphs
  # When enabled, CUDA graphs will be released by TMS to save GPU memory
  # This requires range to be "all"
  enable_cuda_graph: False

  # Whether to enable TMS on NIXL temp buffers
  # When enabled, NIXL temp buffers will be released by TMS to save GPU
  # and the reregister will be simplified.
  enable_nixl: False

# LMCache KV cache offloading configuration.
# When enabled, vLLM offloads KV cache to the specified backend (CPU by default),
# enabling prefix cache hits across multi-turn agent loop turns without re-prefill.
lmcache:

  # Whether to enable LMCache KV offloading in vLLM.
  enable: False

  # Backend for offloaded KV: "cpu", "disk", or "remote" (TODO: remote).
  backend: cpu

  # Total offload budget in GiB, summed across all TP ranks.
  # vLLM automatically divides this by the number of KV ranks (TP x PP) to
  # compute the per-rank budget passed to LMCache as max_local_cpu_size.
  # Do NOT set LMCACHE_MAX_LOCAL_CPU_SIZE as an env var — that would apply
  # the total budget to every rank, overcounting memory.
  offload_size_gb: 10.0

  # Token chunk size for hash-based KV indexing (must divide the block size).
  chunk_size: 256

  # Full LMCache YAML config path.  When set, overrides all individual fields.
  config_file: null

  # Whether to clear stale KV cache after model weight pull from PS.
  clear_on_weight_update: False

  # Whether to enable multi-version KV cache.
  multi_version_kv: True

  # --- CPU backend ---

  # GiB of CPU memory to keep free and never use for KV offloading.
  reserve_local_cpu_size: 0.0

  # --- Disk backend ---

  # Filesystem path for disk-backed KV storage (required when backend=disk).
  disk_path: null

  # Max disk usage in GiB when using the disk backend.
  max_disk_size_gb: 50.0

  # --- Remote backend (TODO) ---

  # Remote LMCache server URL (e.g., "redis://host:6379").
  remote_url: null

  # --- Cache behaviour ---

  # Also cache KV from decode steps (increases memory, helps multi-turn reuse).
  save_decode_cache: True

  # NOTE(lhy): Buggy, do not use. 
  # Persist a chunk even when not fully filled (helps short prompts < chunk_size).
  save_unfull_chunk: False

  # Eviction policy: "LRU" (default) or "FIFO".
  cache_policy: LRU

  # Overlap KV cache retrieval with prefill computation to reduce TTFT.
  # NOTE(lhy): This is buggy, do not use.
  enable_async_loading: False

  # --- P2P cross-instance KV transfer ---
  # Required when routing_strategy.kv_transfer.enable is True.

  # Enable LMCache P2P backend + Controller for cross-instance KV transfer.
  # Requires clear_on_weight_update=False and multi_version_kv=True (P2PBackend
  # does not support clear on weight sync; version tags prevent stale KV hits).
  # A shared Controller process is started by RolloutCoordinator and its URL is
  # broadcast to all GenWorker instances at startup.
  # Each instance is automatically assigned lmcache_instance_id = psrl_instance_{id}.
  enable_p2p: False

  # Transport channel for P2P transfer.
  # "nixl" -- uses UCX (PSRL already has NIXL/UCX installed); automatically
  #           selects shared-memory/IPC on same node and RDMA on multi-node.
  #           Recommended for all deployment topologies.
  # "tcp"  -- fallback when NIXL/UCX is unavailable.
  p2p_transfer_channel: nixl

  # Base port for the shared LMCache Controller's HTTP API (FastAPI/uvicorn).
  # PSRL calls this port for /move, /lookup etc. REST endpoints.
  # RolloutCoordinator picks the actual port starting from this value
  # using find_available_port().
  controller_base_port: 9000

  # Seconds to wait for the shared LMCache Controller HTTP API (GET /openapi.json)
  # to become healthy before failing init. The controller imports torch+vLLM at
  # startup (~30-40s standalone) and runs on the busy ps_manager node, so under
  # cluster CPU/FS contention it can exceed the old 90s budget.
  controller_health_timeout_s: 3000

  # Host where the LMCache Controller runs. Defaults to psrl.ps_manager_ip.
  # Both PSRL (HTTP) and LMCache workers (ZMQ) connect to this host.
  controller_host: ${psrl.ps_manager_ip}

  # ZMQ PULL port: Controller listens here for LMCache worker registrations
  # and heartbeats. Each vLLM instance's LMCache worker connects to this port
  # on startup to register itself with the Controller.
  controller_pull_port: 8300

  # ZMQ REPLY port: Controller sends task instructions (move, clear, etc.)
  # to LMCache workers through this port. Workers connect here to receive
  # commands dispatched by the Controller after a /move HTTP request.
  controller_reply_port: 8400

  # Maximum number of GPU KV blocks PSRL may hold pinned simultaneously
  # (used by routing_strategy.kv_transfer.transfer_mode == "pin_sync").
  # When exceeded, the oldest-pinned trajectory is unpinned (PSRL-side LRU).
  # 0 means no limit.
  gpu_pin_block_budget: 0

rollout_gateway:
  # TITO trajectory assignment: manual reads x-smg-tito-trajectory-id (default 0),
  # while auto derives IDs from matching prefix-tree leaves inside SMG.
  trajectory_id_strategy: manual

  # rust: SMG preprocesses pixels (fast); python: forward HF tensors (exact).
  multimodal_preprocessing: rust

  # SMG -> vLLM tensor transport. auto uses /dev/shm only after SMG verifies
  # that the selected worker shares the namespace; otherwise it stays inline.
  multimodal_tensor_transport: auto
  multimodal_shm_min_bytes: 65536

  # Max HTTP generation concurrency per rollout server.
  # The global HTTP budget is
  # server_max_concurrency * number_of_active_rollout_servers.
  server_max_concurrency: 256

  # Whether AgentLoopWorkers should route POST requests through a Ray actor pool.
  # The pool is created by AgentLoopManager and selected with round-robin.
  use_distributed_post: False

  # Number of HTTP POST actors to place on each alive Ray node when
  # use_distributed_post is enabled.
  post_actor_num_per_node: 8

  # Per-module Rust log filter for the SMG gateway process (RUST_LOG syntax).
  # Overrides the default log_level=warn when set. Use tracing directive syntax.
  # Empty string "" means no override (use default warn level).
  rust_log_filter: "warn,smg::routers::grpc::kv_transfer=warn,smg::routers::grpc::common::stages::worker_selector::psrl=warn,route_trace=info"

  # Wait for local VllmEngine.HealthCheck before POST /workers to SMG gateway.
  grpc_registration_health_timeout_s: 300
  grpc_registration_health_poll_interval_s: 1.0
  grpc_registration_health_rpc_timeout_s: 5.0

  # Serve SubscribeKvEvents through a buffering KvEventReplayHub so the gateway
  # can replay missed sequences after a gap. When False (default), use the
  # original per-subscription inline ZMQ loop with no buffering.
  #
  # Default is False: the gateway's KV-event monitor now tolerates seq gaps
  # (monotonic acceptance, no reconnect/resync storm), so the hub's only purpose
  # — replaying missed sequences to keep seq strictly contiguous — is no longer
  # needed. The inline path is simpler, has no ingester-thread overhead, and was
  # verified to give ~100% cache-overlap routing. The hub path is retained for
  # opt-in use but currently exhibits a 0-overlap indexing bug under investigation.
  enable_kv_event_replay: False
